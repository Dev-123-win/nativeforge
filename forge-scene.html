<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NativeForge Headless Scene Renderer</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body, #root { width: 100%; height: 100%; overflow: hidden; background: #000; }
      #root canvas { width: 100%; height: 100%; display: block; }
      #forge-status {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        color: #8b98b8; font: 13px monospace; pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="forge-status">waiting for scene…</div>
    <script type="module" src="/src/forge/render/forgeEntry.tsx"></script>
  </body>
</html>
